{{- /* 开屏动画：只在首页显示。
       淡出完全由 CSS 的 animation-delay + forwards 完成，
       即使脚本失败，画面也会自己消失，不会永久盖住页面。 */ -}}
{{- if .IsHome }}
<div id="intro" aria-hidden="true">
    <div class="intro-bg"></div>
    <div class="intro-content">
        <div class="intro-scene-1">
            <img class="intro-avatar" src="/images/avatar.webp" alt="">
            <div class="intro-name">SiO₂</div>
        </div>
    </div>
</div>
<script>
    // 首次进站 / 刷新时播放；从站内点回首页时不重播
    (function () {
        var intro = document.getElementById('intro');
        if (!intro) return;

        var ref = document.referrer || '';
        var cameFromInsidePage = ref.indexOf(location.origin) === 0 && ref !== location.href;

        if (cameFromInsidePage) {
            intro.parentNode.removeChild(intro);
        }
    })();
</script>
{{- end }}

<script>

    /* 粉色花瓣：
       参考 particles.js 的参数（数量 200、速度 2、向下飘），
       但用 canvas 直接画花瓣形状，体积更小、形状更接近真的花瓣。
       只画 hero 区域；滚出屏幕自动暂停，移动端数量减半。 */
    (function () {
        var canvas = document.getElementById('page-petals');
        if (!canvas) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        var ctx = canvas.getContext('2d');
        var W = 0, H = 0;
        /* 花瓣很小，不需要 2 倍像素密度。
           固定 1 倍可以把每帧要填充的像素减少约 75%，高 DPI 屏幕上差很多。 */
        var dpr = 1;
        var petals = [];
        var running = true;
        var lastTime = 0;
        var lastDraw = 0;
        var FALL_SPEED = 2;          // 参考站 move.speed = 2

        /* 把花瓣形状预先画进一张小图，之后每帧只做 drawImage。
           之前每片花瓣每帧都要走一次贝塞尔路径 + 填充，140 片会很吃力。 */
        var sprite = document.createElement('canvas');
        var SPRITE_SIZE = 64;
        sprite.width = sprite.height = SPRITE_SIZE;
        (function () {
            var s = sprite.getContext('2d');
            s.translate(SPRITE_SIZE / 2, SPRITE_SIZE / 2);
            var r = SPRITE_SIZE / 2 - 2;
            s.fillStyle = '#ffb7c5';
            s.beginPath();
            s.moveTo(0, -r);
            s.bezierCurveTo(r * 0.95, -r * 0.65, r * 0.85, r * 0.6, 0, r);
            s.bezierCurveTo(-r * 0.85, r * 0.6, -r * 0.95, -r * 0.65, 0, -r);
            s.closePath();
            s.fill();
        })();

        function rand(a, b) { return a + Math.random() * (b - a); }

        function makePetal(initial) {
            return {
                x: rand(0, W),
                y: initial ? rand(0, H) : rand(-H * 0.25, -10),
                size: rand(4, 11),
                speed: rand(FALL_SPEED * 0.6, FALL_SPEED * 1.6),
                sway: rand(0.4, 1.5),
                phase: rand(0, Math.PI * 2),
                spin: rand(-0.02, 0.02),
                angle: rand(0, Math.PI * 2),
                alpha: rand(0.3, 0.85)
            };
        }

        function resize() {
            W = Math.max(1, window.innerWidth);
            H = Math.max(1, window.innerHeight);
            canvas.width = Math.floor(W * dpr);
            canvas.height = Math.floor(H * dpr);
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            var count = W < 768 ? 45 : 90;
            petals = [];
            for (var i = 0; i < count; i++) petals.push(makePetal(true));
        }

        function drawPetal(p) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.globalAlpha = p.alpha;
            ctx.drawImage(sprite, -p.size, -p.size, p.size * 2, p.size * 2);
            ctx.restore();
        }

        function tick(now) {
            if (!running) return;

            // 限制到约 30fps：花瓣不需要 60fps，能省一半绘制开销
            if (now - lastDraw < 33) {
                window.requestAnimationFrame(tick);
                return;
            }

            var dt = lastTime ? Math.min((now - lastTime) / 16.67, 3) : 1;
            lastTime = now;
            lastDraw = now;

            ctx.clearRect(0, 0, W, H);
            for (var i = 0; i < petals.length; i++) {
                var p = petals[i];
                p.y += p.speed * dt;
                p.phase += 0.012 * dt;
                p.x += Math.sin(p.phase) * p.sway * dt;
                p.angle += p.spin * dt;

                if (p.y > H + 30) {
                    p.y = -30;
                    p.x = rand(0, W);
                }
                if (p.x < -30) p.x = W + 30;
                if (p.x > W + 30) p.x = -30;

                drawPetal(p);
            }
            window.requestAnimationFrame(tick);
        }

        resize();
        window.addEventListener('resize', resize);
        window.requestAnimationFrame(tick);
    })();

    /* 预取文章链接：鼠标悬停/按下时，浏览器提前下载目标页 HTML，
       点击后不用再等 1～2 秒。不支持 Speculation Rules 的浏览器会自动跳过。 */
    (function () {
        if (!(window.HTMLScriptElement && HTMLScriptElement.supports &&
                HTMLScriptElement.supports('speculationrules'))) return;

        var links = document.querySelectorAll('.post-entry .entry-link');
        if (!links.length) return;

        var urls = [];
        links.forEach(function (a) {
            if (a.href) urls.push(a.href);
        });
        if (!urls.length) return;

        var s = document.createElement('script');
        s.type = 'speculationrules';
        s.textContent = JSON.stringify({
            prefetch: [{ source: 'list', urls: urls, eagerness: 'moderate' }]
        });
        document.head.appendChild(s);
    })();

    /* 目录滚动高亮：滚到哪一节，侧边目录对应那行就加粗 */
    (function () {
        var toc = document.querySelector('.post-single details.toc');
        if (!toc) return;

        // 逐条配对，单条失败不影响整体。
        var anchors = Array.prototype.slice.call(toc.querySelectorAll('.inner a[href]'));
        var items = [];

        anchors.forEach(function (a) {
            var raw = a.getAttribute('href') || '';
            if (raw.charAt(0) !== '#') return;

            var id = raw.slice(1);
            try { id = decodeURIComponent(id); } catch (e) { /* 原样使用 */ }

            var el = document.getElementById(id);
            if (el) items.push({ link: a, el: el });
        });

        if (!items.length) return;

        var current = null;

        function topOf(el) {
            return el.getBoundingClientRect().top + window.scrollY;
        }

        function setActive(item) {
            if (current === item) return;
            if (current) current.link.classList.remove('toc-active');
            item.link.classList.add('toc-active');
            current = item;

            var box = toc.getBoundingClientRect();
            var r = item.link.getBoundingClientRect();
            if (r.top < box.top + 36) {
                toc.scrollTop -= (box.top + 36 - r.top);
            } else if (r.bottom > box.bottom - 16) {
                toc.scrollTop += (r.bottom - (box.bottom - 16));
            }
        }

        function update() {
            var line = window.scrollY + window.innerHeight * 0.33;
            var found = items[0];

            for (var i = 0; i < items.length; i++) {
                if (topOf(items[i].el) <= line) {
                    found = items[i];
                } else {
                    break;
                }
            }

            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
                found = items[items.length - 1];
            }

            setActive(found);
        }

        var ticking = false;
        window.addEventListener('scroll', function () {
            if (ticking) return;
            ticking = true;
            window.requestAnimationFrame(function () {
                update();
                ticking = false;
            });
        }, { passive: true });

        window.addEventListener('resize', update);
        window.addEventListener('load', update);
        update();
    })();
</script>
